name: Tag and Release

on:
    push:
        branches: [main, next]

jobs:
    release:
        name: Release
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  fetch-tags: true

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "lts/*"

            - name: Create package.json if not exists
              id: package
              run: |
                  echo "has_package=1" >> $GITHUB_OUTPUT
                  if [ ! -f package.json ]; then
                    echo '{"name": "project", "version": "1.0.0", "private": true}' > package.json
                    echo "has_package=0" >> $GITHUB_OUTPUT
                  fi

            - name: Create .releaserc.json
              run: |
                  if [ ! -f .releaserc.json ]; then
                  cat > .releaserc.json << 'EOF'
                  {
                    "branches": ["main","next"],
                    "plugins": [
                      [
                        "@semantic-release/commit-analyzer",
                        {
                          "preset": "conventionalcommits",
                          "releaseRules": [
                            { "type": "feat", "release": "minor" },
                            { "type": "fix", "release": "patch" },
                            { "breaking": true, "release": "major" }
                          ]
                        }
                      ],
                      "@semantic-release/release-notes-generator",
                      "@semantic-release/changelog",
                      [
                        "@semantic-release/git",
                        {
                          "assets": ["CHANGELOG.md"],
                          "message": "chore(release): ${nextRelease.version} [skip ci]"
                        }
                      ],
                      "@semantic-release/github"
                    ]
                  }
                  EOF
                  fi

            - name: Install dependencies
              run: |
                  npm install --no-audit --silent \
                    @semantic-release/commit-analyzer \
                    @semantic-release/release-notes-generator \
                    @semantic-release/changelog \
                    @semantic-release/git \
                    @semantic-release/exec \
                    @semantic-release/github \
                    conventional-changelog-conventionalcommits
              env:
                  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

            - name: Find releasing version
              run: |
                  npx semantic-release --dry-run > output.log
                  NEW_VERSION=$(grep -oP 'Published release \K[0-9]+\.[0-9]+\.[0-9]+' output.log)
                  echo "New version releasing: $NEW_VERSION"
                  jq ".version = \"$NEW_VERSION\"" composer.json > composer.json.tmp && mv composer.json.tmp composer.json
                  jq ".version = \"$NEW_VERSION\"" package.json > package.json.tmp && mv package.json.tmp package.json
                  git add composer.json
                  if [ ${{ steps.package.outputs.has_package }} = 1 ];
                    git add package.json
                  fi
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Semantic Release
              uses: cycjimmy/semantic-release-action@v4
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
