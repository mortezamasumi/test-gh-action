name: Auto Tag on Commit

on:
    push:
        branches:
            - main

jobs:
    auto-tag:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Auto Tag
              uses: OlegVF/auto_tag_action@v1.3
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
