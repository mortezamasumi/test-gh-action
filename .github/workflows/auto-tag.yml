name: Semantic Release

on:
    push:
        branches:
            - main

jobs:
    release:
        name: Release
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  fetch-tags: true

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "lts/*"

            - name: Create package.json if not exists
              run: |
                  if [ ! -f package.json ]; then
                    echo '{"name": "project", "version": "1.0.0", "private": true}' > package.json
                  fi

            - name: Install dependencies
              run: |
                  npm install --no-audit --silent \
                    @semantic-release/commit-analyzer \
                    @semantic-release/release-notes-generator \
                    @semantic-release/changelog \
                    @semantic-release/npm \
                    @semantic-release/git \
                    @semantic-release/github \
                    conventional-changelog-conventionalcommits
              env:
                  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

            - name: Debug npm configuration
              run: |
                  npm config list
                  npm --version
                  node --version

            - name: Semantic Release
              uses: cycjimmy/semantic-release-action@v4
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  semantic_version: 20.1.1

            - name: Debug Output
              if: always()
              run: |
                  echo "Semantic Release Tag: ${{ steps.semantic-release.outputs.SEMANTIC_RELEASE_TAG }}"
