name: Tag and Release

on:
    push:
        branches:
            - main

jobs:
    release:
        name: Release
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  fetch-tags: true

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "lts/*"

            - name: Create package.json if not exists
              run: |
                  if [ ! -f package.json ]; then
                    echo '{"name": "project", "version": "1.0.0", "private": true}' > package.json
                  fi

            - name: Create .releaserc.json
              run: |
                  if [ ! -f .releaserc.json ]; then
                  cat > .releaserc.json << 'EOF'
                  {
                    "branches": ["main"],
                    "plugins": [
                      [
                        "@semantic-release/commit-analyzer",
                        {
                          "preset": "conventionalcommits",
                          "releaseRules": [
                            { "type": "feat", "release": "minor" },
                            { "type": "fix", "release": "patch" },
                            { "breaking": true, "release": "major" }
                          ]
                        }
                      ],
                      "@semantic-release/release-notes-generator",
                      "@semantic-release/changelog",
                      [
                        "@semantic-release/exec",
                        {
                          "prepareCmd": "./.github/scripts/update-composer-version.sh ${nextRelease.version}"
                        }
                      ],
                      [
                        "@semantic-release/git",
                        {
                          "assets": ["composer.json", "CHANGELOG.md"],
                          "message": "chore(release): ${nextRelease.version} [skip ci]"
                        }
                      ],
                      "@semantic-release/github"
                    ]
                  }
                  EOF
                  fi

            - name: Install dependencies
              run: |
                  npm install --no-audit --silent \
                    @semantic-release/commit-analyzer \
                    @semantic-release/release-notes-generator \
                    @semantic-release/changelog \
                    @semantic-release/git \
                    @semantic-release/github \
                    conventional-changelog-conventionalcommits
              env:
                  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

            # - name: Debug npm configuration
            #   run: |
            #       npm config list
            #       npm --version
            #       node --version

            # - name: Debug semantic-release
            #   run: npx semantic-release --dry-run
            #   env:
            #       GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Semantic Release
              uses: cycjimmy/semantic-release-action@v4
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
