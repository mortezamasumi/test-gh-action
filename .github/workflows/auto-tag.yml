name: Auto Tag on Commit

on:
    push:
        branches:
            - main

jobs:
    auto-tag:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Auto Tag
              uses: cycjimmy/semantic-versioning-action@v2
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
