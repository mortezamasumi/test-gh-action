# semantic-release:
# fix:  patch
# feat:  minor
# BREAKING CHANGE: major

name: Release
on:
    push:
        branches:
            - main
permissions:
    contents: write
    issues: write
    pull-requests: write

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            # Checkout the repository
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  persist-credentials: false

            # Set up Node.js
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "lts/*"

            # Install semantic-release and plugins
            - name: Install semantic-release dependencies
              run: |
                  npm install --no-save \
                    semantic-release \
                    @semantic-release/commit-analyzer \
                    @semantic-release/release-notes-generator \
                    @semantic-release/changelog \
                    @semantic-release/git \
                    @semantic-release/github

            # Run semantic-release
            - name: Semantic Release
              id: semantic
              uses: cycjimmy/semantic-release-action@v4
              env:
                  GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
              with:
                  extra_plugins: |
                      @semantic-release/changelog
                      @semantic-release/git

            # Create a release asset (e.g., a zip of the project)
            - name: Create release zip
              if: steps.semantic.outputs.new_release_published == 'true'
              run: zip -r release.zip .

            # Publish release with softprops/action-gh-release
            - name: Publish GitHub Release
              if: steps.semantic.outputs.new_release_published == 'true'
              uses: softprops/action-gh-release@v2
              with:
                  files: release.zip
                  name: Version ${{ steps.semantic.outputs.new_release_version }}
                  tag_name: v${{ steps.semantic.outputs.new_release_version }}
              env:
                  GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

