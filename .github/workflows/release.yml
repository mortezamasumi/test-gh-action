name: Release
on:
    push:
        branches:
            - main

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0 # Required for semantic-release to analyze commit history
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
            - name: Create minimal package.json if not exists
              run: |
                  if [ ! -f package.json ]; then
                  cat > package.json << 'EOF'
                  {
                    "name": "semantic-release",
                    "version": "0.0.1",
                    "private": true
                  }
                  EOF
                  fi
            - name: Install jq
              run: sudo apt-get update && sudo apt-get install -y jq
            - name: Configure Git
              run: |
                  git config user.name "GitHub Actions"
                  git config user.email "actions@github.com"
            - name: Delete main tag if exists
              env:
                  GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
              run: |
                  git fetch origin
                  if git tag -l | grep -q '^main$'; then
                    git tag -d main
                    git push https://x-access-token:${GITHUB_TOKEN}@github.com/mortezamasumi/test-gh-action.git :refs/tags/main
                  fi
            - name: Append release block to package.json
              run: |
                  jq '. + {
                    "release": {
                      "branches": ["main"],
                      "tagFormat": "v${version}",
                      "plugins": [
                        "@semantic-release/commit-analyzer",
                        "@semantic-release/release-notes-generator",
                        ["@semantic-release/npm", { "npmPublish": false }],
                        ["@semantic-release/git", {
                          "assets": ["package.json"],
                          "message": "chore(release): v${nextRelease.version} [skip ci]\n\n${nextRelease.notes}"
                        }],
                        ["@semantic-release/exec", {
                          "publishCmd": "echo SEMANTIC_RELEASE_TAG=v${nextRelease.version} >> $GITHUB_OUTPUT"
                        }],
                        "@semantic-release/github"
                      ]
                    }
                  }' package.json > package.json.tmp && mv package.json.tmp package.json
            - name: Install dependencies
              run: npm install -g semantic-release @semantic-release/changelog @semantic-release/git @semantic-release/github @semantic-release/commit-analyzer @semantic-release/release-notes-generator @semantic-release/exec
            - name: Debug References
              run: |
                  git branch -a
                  git tag -l
                  git remote -v
                  echo "GitHub Ref: ${{ github.ref }}"
                  echo "GitHub Ref Name: ${{ github.ref_name }}"
                  cat package.json
            - name: Semantic Release
              id: semantic-release
              env:
                  GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
              run: npx semantic-release
            - name: Debug Output
              if: always()
              run: |
                  echo "Semantic Release Tag: ${{ steps.semantic-release.outputs.SEMANTIC_RELEASE_TAG }}"
                  git tag -l
            - name: Create GitHub Release
              if: steps.semantic-release.outputs.SEMANTIC_RELEASE_TAG != ''
              uses: softprops/action-gh-release@v1
              with:
                  name: Release ${{ steps.semantic-release.outputs.SEMANTIC_RELEASE_TAG }}
                  tag_name: ${{ steps.semantic-release.outputs.SEMANTIC_RELEASE_TAG }}
                  draft: false
                  prerelease: false
              env:
                  GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
