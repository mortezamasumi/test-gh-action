name: Release Please

on:
    push:
        branches:
            - main

permissions:
    contents: write
    pull-requests: write

jobs:
    release:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repo
              uses: actions/checkout@v4

            - uses: googleapis/release-please-action@v4
              id: release
              with:
                  release-type: php
                  token: "${{ secrets.RELEASE_TOKEN }}"
            - name: Find open release PR
              id: find_pr
              run: |
                  pr_number=$(gh pr list --state open --author "release-please[bot]" --json number,title --jq '.[0].number')
                  echo "Found PR number: $pr_number"
                  echo "pr_number=$pr_number" >> $GITHUB_OUTPUT
              env:
                  GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}

            - name: Enable Auto Merge (if PR created)
              if: always() # ensures this runs even if release didn't create PR
              run: |
                  echo "PR NUMBER: ${{ steps.release.outputs.pull-request-number }}"
                  if [ -n "${{ steps.release.outputs.pull-request-number }}" ]; then
                    gh pr merge ${{ steps.release.outputs.pull-request-number }} --squash --auto
                  else
                    echo "No release PR created — skipping auto-merge."
                  fi
              env:
                  GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}

