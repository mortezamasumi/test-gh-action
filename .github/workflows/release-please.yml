name: Manual Release + Merge

on:
    push:
        branches:
            - main

permissions:
    contents: write
    pull-requests: write

jobs:
    release:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Run Release Please
              id: release
              uses: google-github-actions/release-please-action@v4
              with:
                  release-type: php
              env:
                  GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}

            - name: Find open release PR
              id: find_pr
              run: |
                  pr_number=$(gh pr list --state open --author "release-please[bot]" --json number,title --jq '.[0].number? // empty')
                  if [ -z "$pr_number" ]; then
                      echo "No open release PR found."
                  else
                      echo "Found PR: $pr_number"
                      echo "pr_number=$pr_number" >> $GITHUB_OUTPUT
                  fi
              env:
                  GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}

            - name: Merge release PR
              if: ${{ steps.find_pr.outputs.pr_number != '' }}
              run: |
                  gh pr merge ${{ steps.find_pr.outputs.pr_number }} --squash --admin --delete-branch --body "Automated release"
              env:
                  GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
