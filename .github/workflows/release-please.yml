name: Release Please

on:
    push:
        branches:
            - main1

permissions:
    contents: write
    pull-requests: write
    issues: write

jobs:
    release:
        runs-on: ubuntu-latest

        steps:
            - uses: googleapis/release-please-action@v4
              id: release
              with:
                  release-type: php
                  token: "${{ secrets.RELEASE_TOKEN }}"
