name: Release Please

on:
    push:
        branches:
            - main

permissions:
    contents: write
    pull-requests: write

jobs:
    release:
        runs-on: ubuntu-latest

        steps:
            - uses: googleapis/release-please-action@v4
              id: release
              with:
                  release-type: php
                  token: "${{ secrets.RELEASE_TOKEN }}"

            - name: Enable Auto Merge
              if: ${{ steps.release.outputs.pull-request-number }}
              uses: peter-evans/enable-pull-request-automerge@v3
              with:
                  token: ${{ secrets.RELEASE_TOKEN }}
                  pull-request-number: ${{ steps.release.outputs.pull-request-number }}
                  merge-method: squash

