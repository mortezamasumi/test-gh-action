name: Run on New Release

on:
    release:
        types: [published] # Triggers when a release is published
    workflow_run:
        workflows: ["Release"] # Name of your semantic-release workflow
        types: [completed]

jobs:
    celebrate:
        runs-on: ubuntu-latest
        steps:
            - name: Print release info
              run: |
                  echo "New release ${{ github.event.release.tag_name }} was published!"
                  echo "Release notes: ${{ github.event.release.body }}"
