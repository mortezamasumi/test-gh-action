name: Simple Manual Release

on:
    workflow_dispatch:
        inputs:
            release_version:
                description: "Release version (e.g. 1.0.0)"
                required: true

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Git
              run: |
                  git config user.name "github-actions"
                  git config user.email "github-actions@github.com"

            - name: Update composer.json version
              run: |
                  jq '.version = "${{ github.event.inputs.release_version }}"' composer.json > tmp.$$.json
                  mv tmp.$$.json composer.json

            - name: Commit version bump
              run: |
                  git add composer.json
                  git commit -m "chore: release v${{ github.event.inputs.release_version }}"
                  git push origin HEAD

            - name: Tag release
              run: |
                  git tag v${{ github.event.inputs.release_version }}
                  git push origin v${{ github.event.inputs.release_version }}

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v1
              with:
                  tag_name: v${{ github.event.inputs.release_version }}
              env:
                  GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
